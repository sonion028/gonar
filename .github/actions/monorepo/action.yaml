name: Monorepo Publish Handler
description: Monorepo 项目 publish 阶段的处理

runs:
  using: composite
  steps:
    # package.json Engines node 版本
    - name: 同步 package.json Engines node 版本
      shell: bash
      run: |
        echo "同步子包 Engines node 版本..."
        NODE_VERSION=$(pnpm pkg get engines.node)
        pnpm -r pkg set engines.node="$NODE_VERSION"
        echo "engines.node synced to $NODE_VERSION ✅"
